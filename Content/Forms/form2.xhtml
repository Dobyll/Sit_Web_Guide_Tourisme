<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" lang="fr" xml:lang="fr">
<head>
    <meta charset="UTF-8"/>
    <title> Avis clients </title>
    <link rel="stylesheet" media="screen" type="text/css" title="form2" href ="../../Styles/form2.css"/>
    <script src="../../Code/Javascript/form2.js"> </script>
</head>
<body>
<button id="returnButton">Retour à la page d'accueil</button>
<h1><strong>Contactez-nous</strong></h1>

<form id="contactForm" action ="" method ="get" >
    <div>
        <label for="nom">Nom :</label><br/>
        <input type="text" id="nom" name="nom" />
        <div id="error-nom" class="error-message"> </div>
    </div>

    <div>
        <label for="prenom">Prénom :</label><br/>
        <input type="text" id="prenom" name="prenom" />
        <div id="error-prenom" class="error-message"> </div>
    </div><br/>

    <div>
        <label for="email">Adresse e-mail :</label><br/>
        <input type="email" id="email" name="email" />
        <div id="error-email" class="error-message"> </div>
    </div><br/>

    <div>
        <label for="objet"><strong>Objet</strong> :</label><br/>
        <select id="objet" name="objet">
            <option value="suggestion">Suggestion</option>
            <option value="question">Question</option>
            <option value="probleme">Problème technique</option>
        </select>
    </div><br/>

    <div>
        <label for="message">Message :</label><br/>
        <textarea id="message" name="message" rows="6" cols="40"> </textarea>
        <div id="error-message" class="error-message"> </div>
    </div><br/>

    <input type="hidden" id="userAgentInformations" name="userAgentInformations" />

    <button type="submit">Envoyer le message</button>
    <button type="button" id="btnTest">Tester la validité</button>
</form>
</body>
</html>
